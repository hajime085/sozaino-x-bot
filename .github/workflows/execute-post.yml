name: 2. Execute Scheduled Post

on:
  schedule:
    - cron: '0 * * * *'   # 毎時 0 分に起動（today-schedule.json の時刻と照合）
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute post
        env:
          X_API_KEY:      ${{ secrets.X_API_KEY }}
          X_API_SECRET:   ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node src/execute-post.js

      - name: Commit updated schedule
        run: |
          git config user.name  "sozaino-bot"
          git config user.email "bot@sozaino.com"
          git add data/today-schedule.json
          git diff --cached --quiet || git commit -m "✅ posted $(date '+%Y-%m-%d %H:%M')"
          git push
